services:
  solr-dev:
    image: solr:8
    container_name: solr-dev
    ports:
      - "127.0.0.1:8984:8983"
    volumes:
      - $DATA/solr_data_dev:/var/solr
    # srv init/update bartoc-search-dev installs the core from its Docker image.
    command: ["solr-foreground"]
    restart: unless-stopped

networks:
  default:
    external: true
    name: solr-dev
