services:
  solr:
    image: solr:8
    container_name: solr
    volumes:
      - $DATA/solr_data:/var/solr
    # srv init/update bartoc-search installs the core from its Docker image.
    command: ["solr-foreground"]
    restart: unless-stopped

networks:
  default:
    external: true
    name: solr
